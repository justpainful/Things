name: Core

# Cheap, fast feedback on Ubuntu. Most of this project's logic lives here on purpose:
# the macOS runner is slow and the developer machine is Windows, so anything that can be
# proven without Xcode is proven here first. See docs/04-CI-AND-LOOP.md §1.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main is the phone-only build: no server, no web client, no npm workspace.
  # Everything that used to run here lives on the `server-web` branch.
  # What survives is the part that protects a PUBLIC repository holding a
  # password manager: nothing real may ever be committed.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No data files committed
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(sqlite|sqlite3|db|thingsbackup|p12|mobileprovision|key|pem)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Data or credential files are committed:"; echo "$bad"; exit 1
          fi
          if git ls-files | grep -Eq '(^|/)(ThingsData|objects|thumbnails)/'; then
            echo "::error::A data directory is committed."; exit 1
          fi
          echo "Clean."
